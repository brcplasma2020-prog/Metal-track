<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetalTrack - Industrial Inventory</title>
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 p-2 rounded-lg font-bold text-lg">⚙️ MetalTrack</div>
    </div>
    <button id="open-sync-modal" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium transition shadow">
      Shop Sync: <span id="current-sync-id" class="font-mono underline">MS-336E</span>
    </button>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 space-y-6">
    
    <!-- Inventory Controls -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold">Inventory & Stock Logs</h1>
        <p class="text-xs text-slate-400">Manage sheet metal, plates, and round pipes.</p>
      </div>
      <button id="open-add-modal" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-semibold transition shadow">
        + Add Material
      </button>
    </div>

    <!-- Inventory Display Table -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-700/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
              <th class="p-3">Material Type</th>
              <th class="p-3">Dimensions / Size</th>
              <th class="p-3">Quantity</th>
              <th class="p-3">Price / Cost</th>
              <th class="p-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="inventory-table-body" class="divide-y divide-slate-700 text-sm">
            <tr>
              <td colspan="5" class="p-6 text-center text-slate-400">Loading shop inventory...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add Material Modal -->
  <div id="add-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl relative space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold flex items-center gap-2">➕ Add New Material</h2>
        <button id="close-add-modal" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-300 font-medium">Material Name / Type:</label>
          <input type="text" id="mat-name" placeholder="e.g. CS .25 5X10" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="text-xs text-slate-300 font-medium">Dimensions / Size:</label>
          <input type="text" id="mat-dimensions" placeholder="e.g. 5x10 ft" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-300 font-medium">Quantity:</label>
            <input type="text" id="mat-quantity" placeholder="e.g. 2" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-xs text-slate-300 font-medium">Price ($):</label>
            <input type="text" id="mat-price" placeholder="e.g. 250.00" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
          </div>
        </div>
      </div>

      <button id="save-material-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-lg font-semibold transition shadow-lg">
        Save to Inventory
      </button>
    </div>
  </div>

  <!-- Shop Channel Sync Modal -->
  <div id="sync-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl relative space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold flex items-center gap-2">📷 Shop Channel Sync</h2>
        <button id="close-sync-modal" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>
      
      <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 text-center">
        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Current Shop Sync ID</div>
        <div id="modal-current-id" class="text-2xl font-mono font-bold text-blue-400">MS-336E</div>
      </div>

      <div class="space-y-2">
        <label class="text-xs text-slate-300 font-medium">Type Target Shop ID Code:</label>
        <input type="text" id="target-shop-input" placeholder="e.g. MS-345R" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white font-mono uppercase focus:outline-none focus:border-blue-500">
      </div>

      <button id="connect-channel-btn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-semibold transition shadow-lg">
        Connect Channel
      </button>
    </div>
  </div>

  <!-- Firebase & App Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDHDDCPeOyHkDGpHZAU9AAdKm14M5LCT-0",
      authDomain: "inventory-management-336e1.firebaseapp.com",
      databaseURL: "https://inventory-management-336e1-default-rtdb.firebaseio.com",
      projectId: "inventory-management-336e1",
      storageBucket: "inventory-management-336e1.firebasestorage.app",
      messagingSenderId: "339104206529",
      appId: "1:339104206529:web:9713c92c01ff02e1234e40",
      measurementId: "G-FTV8SW22YN"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Load Shop ID persistence
    let currentShopId = localStorage.getItem('metaltrack_shop_id') || 'MS-336E';
    document.getElementById('current-sync-id').innerText = currentShopId;
    document.getElementById('modal-current-id').innerText = currentShopId;

    // Modal Control Elements (Sync)
    const syncModal = document.getElementById('sync-modal');
    document.getElementById('open-sync-modal').addEventListener('click', () => syncModal.classList.remove('hidden') || syncModal.classList.add('flex'));
    document.getElementById('close-sync-modal').addEventListener('click', () => syncModal.classList.add('hidden'));

    // Modal Control Elements (Add Material)
    const addModal = document.getElementById('add-modal');
    document.getElementById('open-add-modal').addEventListener('click', () => addModal.classList.remove('hidden') || addModal.classList.add('flex'));
    document.getElementById('close-add-modal').addEventListener('click', () => addModal.classList.add('hidden'));

    // Handle Connect Channel Button
    document.getElementById('connect-channel-btn').addEventListener('click', () => {
      const inputVal = document.getElementById('target-shop-input').value.trim().toUpperCase();
      if (inputVal) {
        localStorage.setItem('metaltrack_shop_id', inputVal);
        location.reload();
      } else {
        alert('Please enter a valid Shop ID code.');
      }
    });

    // Bind Realtime Database Listener to Active Shop Channel Path
    const inventoryRef = ref(db, `shops/${currentShopId}/inventory`);
    
    onValue(inventoryRef, (snapshot) => {
      const data = snapshot.val();
      const tbody = document.getElementById('inventory-table-body');
      tbody.innerHTML = '';

      if (!data) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">No inventory records found for channel ${currentShopId}. Tap '+ Add Material' above.</td></tr>`;
        return;
      }

      Object.entries(data).forEach(([id, item]) => {
        const row = document.createElement('tr');
        row.className = "hover:bg-slate-700/30 transition";
        row.innerHTML = `
          <td class="p-3 font-medium">${item.name || 'Unnamed Material'}</td>
          <td class="p-3 text-slate-300">${item.dimensions || 'N/A'}</td>
          <td class="p-3 text-slate-300">${item.quantity || 0}</td>
          <td class="p-3 text-emerald-400 font-mono">$${item.price || '0.00'}</td>
          <td class="p-3 text-right">
            <button data-id="${id}" class="delete-btn text-red-400 hover:text-red-300 text-xs px-2 py-1 bg-red-950/40 rounded border border-red-900/50">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    });

    // Save Material Form Handler
    document.getElementById('save-material-btn').addEventListener('click', () => {
      const name = document.getElementById('mat-name').value.trim();
      const dimensions = document.getElementById('mat-dimensions').value.trim();
      const quantity = document.getElementById('mat-quantity').value.trim();
      const price = document.getElementById('mat-price').value.trim();

      if (!name) {
        alert('Please enter a material name.');
        return;
      }

      const newRef = push(inventoryRef);
      set(newRef, {
        name: name,
        dimensions: dimensions || 'Standard',
        quantity: quantity || '1',
        price: price || '0.00'
      }).then(() => {
        // Clear inputs and close modal
        document.getElementById('mat-name').value = '';
        document.getElementById('mat-dimensions').value = '';
        document.getElementById('mat-quantity').value = '';
        document.getElementById('mat-price').value = '';
        addModal.classList.add('hidden');
      }).catch((err) => {
        alert('Error saving to Firebase: ' + err.message);
      });
    });

    // Event delegation for deleting items
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-btn')) {
        const id = e.target.getAttribute('data-id');
        if (confirm("Are you sure you want to delete this inventory item?")) {
          remove(ref(db, `shops/${currentShopId}/inventory/${id}`));
        }
      }
    });
  </script>
</body>
</html>
