<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetalTrack - Industrial Inventory</title>
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header / Navigation Bar -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg sticky top-0 z-40 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
      <div class="flex items-center gap-2">
        <div class="bg-blue-600 text-white p-2 rounded-xl font-bold text-lg shadow-inner">⚙️</div>
        <div>
          <h1 class="font-bold text-base tracking-wide">MetalTrack</h1>
          <div class="flex items-center gap-1.5 text-xs text-slate-400">
            <span id="network-dot" class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
            <span id="network-status">Ready / Synced</span>
          </div>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
      <!-- Total Valuation Badge -->
      <div class="flex flex-col text-right px-3 py-1 bg-slate-800/80 rounded-lg border border-slate-700/50">
        <span class="text-[10px] uppercase text-slate-400 font-semibold tracking-wider">Total Value</span>
        <span id="total-inventory-value" class="text-emerald-400 font-mono font-bold text-sm">$0.00</span>
      </div>

      <!-- Shop Sync Button -->
      <button id="open-sync-modal" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition shadow-md flex items-center justify-center gap-1">
        <span>Sync:</span> <span id="current-sync-id" class="font-mono underline font-bold">MS-336E</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
    
    <!-- Action Control Deck -->
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="w-full sm:w-auto">
        <h2 class="text-lg font-bold">Material Inventory</h2>
        <p class="text-xs text-slate-400">Multi-pricing options, item editing, & local shop auto-backup.</p>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <!-- Category Filter Tabs -->
        <select id="category-filter" class="flex-1 sm:flex-none bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 font-medium focus:outline-none focus:border-blue-500">
          <option value="ALL">All Categories</option>
          <option value="Sheet Metal">Sheet Metal</option>
          <option value="Plate">Plate Steel</option>
          <option value="Round Pipe">Round Pipe</option>
          <option value="Square Tube">Square Tubing</option>
          <option value="Structural">Structural / Beams</option>
        </select>

        <button id="open-add-modal" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition shadow-lg flex items-center gap-1">
          <span>➕</span> Add Material
        </button>
      </div>
    </div>

    <!-- Vertical Cards List Container -->
    <div id="inventory-list" class="space-y-4">
      <div class="p-8 text-center text-slate-500 bg-slate-900 rounded-2xl border border-slate-800">
        Loading inventory from local shop storage...
      </div>
    </div>
  </main>

  <!-- Add / Edit Material Modal -->
  <div id="add-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative space-y-5">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="modal-title" class="text-base font-bold flex items-center gap-2">➕ Add New Stock Item</h3>
        <button id="close-add-modal" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>
      
      <input type="hidden" id="edit-item-id" value="">

      <div class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-slate-300 font-semibold mb-1 block">Category:</label>
            <select id="mat-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
              <option value="Sheet Metal">Sheet Metal</option>
              <option value="Plate">Plate Steel</option>
              <option value="Round Pipe">Round Pipe</option>
              <option value="Square Tube">Square Tubing</option>
              <option value="Structural">Structural / Beams</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-300 font-semibold mb-1 block">Material Name / Grade:</label>
            <input type="text" id="mat-name" placeholder="e.g. CS .25 5X10 or 2&quot; OD Pipe" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-300 font-semibold mb-1 block">Dimensions / Size / Length:</label>
          <input type="text" id="mat-dimensions" placeholder="e.g. 5x10 ft or 20 ft length" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Multiple Pricing Option Selector -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
          <div>
            <label class="text-xs text-blue-400 font-semibold mb-1 block">Pricing Method:</label>
            <select id="pricing-mode" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-blue-500">
              <option value="unit">Price per Unit (Piece/Sheet)</option>
              <option value="sq">Price per Square Unit ($/m² or $/ft²)</option>
              <option value="total">Total Batch Price</option>
            </select>
          </div>
          <div>
            <label id="price-label" class="text-xs text-slate-300 font-semibold mb-1 block">Price Amount ($):</label>
            <input type="number" step="0.01" id="mat-price" placeholder="250.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-slate-300 font-semibold mb-1 block">Quantity / Stock:</label>
            <input type="number" id="mat-quantity" placeholder="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-xs text-slate-300 font-semibold mb-1 block">Reserved for Job / Client:</label>
            <input type="text" id="mat-reserved" placeholder="e.g. Fire Pit Build" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
          </div>
        </div>
      </div>

      <button id="save-material-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3.5 rounded-xl font-bold text-sm transition shadow-lg">
        Save Material & Auto-Backup
      </button>
    </div>
  </div>

  <!-- Shop Channel Sync Modal -->
  <div id="sync-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative space-y-5">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold flex items-center gap-2">📷 Shop Channel Sync</h3>
        <button id="close-sync-modal" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>
      
      <div class="bg-slate-950/70 p-4 rounded-xl border border-slate-800 text-center space-y-1">
        <div class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Active Shop ID Channel</div>
        <div id="modal-current-id" class="text-2xl font-mono font-bold text-blue-400">MS-336E</div>
      </div>

      <div class="space-y-2">
        <label class="text-xs text-slate-300 font-semibold block">Connect to Target Shop ID Code:</label>
        <input type="text" id="target-shop-input" placeholder="e.g. BRC-WELDING" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono uppercase text-sm focus:outline-none focus:border-blue-500">
      </div>

      <button id="connect-channel-btn" class="w-full bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold text-sm transition shadow-lg">
        Switch & Sync Channel
      </button>
    </div>
  </div>

  <!-- Firebase & App Script Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHDDCPeOyHkDGpHZAU9AAdKm14M5LCT-0",
      authDomain: "inventory-management-336e1.firebaseapp.com",
      databaseURL: "https://inventory-management-336e1-default-rtdb.firebaseio.com",
      projectId: "inventory-management-336e1",
      storageBucket: "inventory-management-336e1.firebasestorage.app",
      messagingSenderId: "339104206529",
      appId: "1:339104206529:web:9713c92c01ff02e1234e40",
      measurementId: "G-FTV8SW22YN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentShopId = localStorage.getItem('metaltrack_shop_id') || 'MS-336E';
    document.getElementById('current-sync-id').innerText = currentShopId;
    document.getElementById('modal-current-id').innerText = currentShopId;

    const backupStorageKey = `metaltrack_backup_${currentShopId}`;

    const syncModal = document.getElementById('sync-modal');
    document.getElementById('open-sync-modal').addEventListener('click', () => syncModal.classList.remove('hidden') || syncModal.classList.add('flex'));
    document.getElementById('close-sync-modal').addEventListener('click', () => syncModal.classList.add('hidden'));

    const addModal = document.getElementById('add-modal');
    document.getElementById('open-add-modal').addEventListener('click', () => {
      document.getElementById('modal-title').innerText = "➕ Add New Stock Item";
      document.getElementById('edit-item-id').value = "";
      document.getElementById('mat-name').value = "";
      document.getElementById('mat-dimensions').value = "";
      document.getElementById('mat-price').value = "";
      document.getElementById('mat-quantity').value = "";
      document.getElementById('mat-reserved').value = "";
      addModal.classList.remove('hidden');
      addModal.classList.add('flex');
    });
    document.getElementById('close-add-modal').addEventListener('click', () => addModal.classList.add('hidden'));

    document.getElementById('connect-channel-btn').addEventListener('click', () => {
      const inputVal = document.getElementById('target-shop-input').value.trim().toUpperCase();
      if (inputVal) {
        localStorage.setItem('metaltrack_shop_id', inputVal);
        location.reload();
      } else {
        alert('Please enter a valid Shop ID code.');
      }
    });

    // Dynamic pricing mode label adjustment
    document.getElementById('pricing-mode').addEventListener('change', (e) => {
      const mode = e.target.value;
      const label = document.getElementById('price-label');
      if (mode === 'sq') label.innerText = "Price per Area/Length ($):";
      else if (mode === 'total') label.innerText = "Total Batch Price ($):";
      else label.innerText = "Price per Unit ($):";
    });

    function calculateAreaInSqMeters(dimStr) {
      if (!dimStr) return 0;
      const lower = dimStr.toLowerCase();
      const matches = lower.match(/\d+(\.\d+)?/g);
      if (!matches || matches.length < 2) return 0;
      const val1 = parseFloat(matches[0]);
      const val2 = parseFloat(matches[1]);
      if (lower.includes('m') && !lower.includes('ft')) return val1 * val2;
      return (val1 * val2) * 0.092903;
    }

    function extractLengthInFeet(dimStr) {
      if (!dimStr) return 0;
      const lower = dimStr.toLowerCase();
      const matches = lower.match(/\d+(\.\d+)?/g);
      if (!matches || matches.length === 0) return 0;
      let lengthVal = parseFloat(matches[matches.length - 1]);
      if (lower.includes('in') || lower.includes('"')) lengthVal = lengthVal / 12;
      return lengthVal > 0 ? lengthVal : 1;
    }

    let cachedInventoryData = JSON.parse(localStorage.getItem(backupStorageKey)) || {};
    renderCards(cachedInventoryData);

    const inventoryRef = ref(db, `shops/${currentShopId}/inventory`);

    onValue(inventoryRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        cachedInventoryData = data;
        localStorage.setItem(backupStorageKey, JSON.stringify(data));
        renderCards(cachedInventoryData);
      }
      document.getElementById('network-status').innerText = "Ready / Synced";
      document.getElementById('network-dot').className = "w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse";
    }, (error) => {
      document.getElementById('network-status').innerText = "Offline (Shop Backup)";
      document.getElementById('network-dot').className = "w-2 h-2 rounded-full bg-amber-500 inline-block";
    });

    function renderCards(data) {
      const container = document.getElementById('inventory-list');
      const selectedCategory = document.getElementById('category-filter').value;
      container.innerHTML = '';

      if (!data || Object.keys(data).length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 bg-slate-900 rounded-2xl border border-slate-800">No stock logged under channel <span class="font-mono text-blue-400">${currentShopId}</span>. Tap '+ Add Material' to begin.</div>`;
        document.getElementById('total-inventory-value').innerText = "$0.00";
        return;
      }

      let grandTotal = 0;
      let count = 0;

      Object.entries(data).forEach(([id, item]) => {
        const category = item.category || 'Sheet Metal';
        if (selectedCategory !== 'ALL' && category !== selectedCategory) return;

        count++;
        const qty = parseFloat(item.quantity) || 0;
        let unitPrice = parseFloat(item.price) || 0;

        // Resolve pricing mode calculation
        const pricingMode = item.pricingMode || 'unit';
        let effectiveUnit = unitPrice;

        const isLinear = category === 'Round Pipe' || category === 'Square Tube' || category === 'Structural' || category === 'Structural / Beams';

        if (pricingMode === 'sq') {
          if (isLinear) {
            const ft = extractLengthInFeet(item.dimensions);
            effectiveUnit = unitPrice * ft;
          } else {
            const m2 = calculateAreaInSqMeters(item.dimensions);
            effectiveUnit = unitPrice * m2;
          }
        } else if (pricingMode === 'total') {
          effectiveUnit = qty > 0 ? (unitPrice / qty) : 0;
        }

        const lineTotal = effectiveUnit * qty;
        grandTotal += lineTotal;

        let rateDisplay = '';
        if (isLinear) {
          const totalFeet = extractLengthInFeet(item.dimensions);
          const pFt = totalFeet > 0 ? (effectiveUnit / totalFeet).toFixed(2) : 'N/A';
          rateDisplay = pFt !== 'N/A' ? `$${pFt}/ft` : 'N/A';
        } else {
          const sqMeters = calculateAreaInSqMeters(item.dimensions);
          const pSqM = sqMeters > 0 ? (effectiveUnit / sqMeters).toFixed(2) : 'N/A';
          rateDisplay = pSqM !== 'N/A' ? `$${pSqM}/m²` : 'N/A';
        }

        const reservedJob = item.reserved && item.reserved.trim() !== '' ? item.reserved : 'General Stock';
        const isReserved = reservedJob !== 'General Stock';

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4 hover:border-slate-700 transition";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2 border-b border-slate-800 pb-3">
            <div>
              <span class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs font-medium border border-slate-700/50 inline-block mb-1.5">${category}</span>
              <h3 class="text-base font-bold text-white tracking-wide">${item.name || 'Unnamed Material'}</h3>
            </div>
            <div class="flex items-center gap-2">
              <button data-id="${id}" class="edit-btn text-blue-400 hover:text-blue-300 text-xs px-3 py-1.5 bg-blue-950/50 hover:bg-blue-900/60 rounded-xl border border-blue-900/50 transition">
                Edit
              </button>
              <button data-id="${id}" class="delete-btn text-red-400 hover:text-red-300 text-xs px-3 py-1.5 bg-red-950/50 hover:bg-red-900/60 rounded-xl border border-red-900/50 transition">
                Delete
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
            <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
              <span class="text-[10px] uppercase text-slate-400 font-semibold block mb-0.5">Dimensions</span>
              <span class="font-mono text-slate-200">${item.dimensions || 'N/A'}</span>
            </div>
            
            <div class="bg-slate-950/60 p-2.5 rounded-xl border border-blue-900/40">
              <span class="text-[10px] uppercase text-blue-400 font-semibold block mb-1">Quantity</span>
              <div class="flex items-center gap-1">
                <button data-id="${id}" data-action="dec" class="qty-btn bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold w-6 h-6 rounded-md flex items-center justify-center text-xs transition border border-slate-700">-</button>
                <input type="number" data-id="${id}" value="${qty}" class="qty-input w-12 bg-slate-900 border border-slate-700 rounded-md text-center text-xs font-mono text-white font-bold py-0.5 focus:outline-none focus:border-blue-500">
                <button data-id="${id}" data-action="inc" class="qty-btn bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold w-6 h-6 rounded-md flex items-center justify-center text-xs transition border border-slate-700">+</button>
              </div>
            </div>

            <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
              <span class="text-[10px] uppercase text-slate-400 font-semibold block mb-0.5">Unit Price</span>
              <span class="font-mono text-slate-200">$${effectiveUnit.toFixed(2)}</span>
            </div>

            <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
              <span class="text-[10px] uppercase text-slate-400 font-semibold block mb-0.5">Calculated Rate</span>
              <span class="font-mono text-blue-400 font-semibold">${rateDisplay}</span>
            </div>
          </div>

          <div class="flex justify-between items-center pt-1 border-t border-slate-800/60 text-xs">
            <div class="flex items-center gap-1.5">
              <span class="text-slate-400 font-medium">Reserved:</span>
              <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold ${isReserved ? 'bg-amber-950/60 text-amber-300 border border-amber-800/60' : 'bg-slate-800 text-slate-400'}">
                ${reservedJob}
              </span>
            </div>
            
            <div class="text-right">
              <span class="text-[10px] uppercase text-slate-400 font-semibold block">Total Cost</span>
              <span class="text-emerald-400 font-mono font-bold text-sm">$${lineTotal.toFixed(2)}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      if (count === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 bg-slate-900 rounded-2xl border border-slate-800">No items match the selected category filter.</div>`;
      }

      document.getElementById('total-inventory-value').innerText = `$${grandTotal.toFixed(2)}`;
    }

    function updateQuantity(id, newQty) {
      const qtyVal = Math.max(0, parseInt(newQty) || 0);
      if (cachedInventoryData[id]) {
        cachedInventoryData[id].quantity = qtyVal.toString();
        localStorage.setItem(backupStorageKey, JSON.stringify(cachedInventoryData));
        renderCards(cachedInventoryData);
        update(ref(db, `shops/${currentShopId}/inventory/${id}`), { quantity: qtyVal.toString() }).catch(() => {});
      }
    }

    document.addEventListener('click', (e) => {
      const qtyBtn = e.target.closest('.qty-btn');
      if (qtyBtn) {
        const id = qtyBtn.getAttribute('data-id');
        const action = qtyBtn.getAttribute('data-action');
        const currentQty = parseInt(cachedInventoryData[id]?.quantity || 0);
        updateQuantity(id, action === 'inc' ? currentQty + 1 : currentQty - 1);
      }

      // Edit Item Trigger
      if (e.target.classList.contains('edit-btn')) {
        const id = e.target.getAttribute('data-id');
        const item = cachedInventoryData[id];
        if (item) {
          document.getElementById('modal-title').innerText = "✏️ Edit Stock Item";
          document.getElementById('edit-item-id').value = id;
          document.getElementById('mat-category').value = item.category || 'Sheet Metal';
          document.getElementById('mat-name').value = item.name || '';
          document.getElementById('mat-dimensions').value = item.dimensions || '';
          document.getElementById('pricing-mode').value = item.pricingMode || 'unit';
          document.getElementById('mat-price').value = item.price || '';
          document.getElementById('mat-quantity').value = item.quantity || '1';
          document.getElementById('mat-reserved').value = item.reserved || '';
          addModal.classList.remove('hidden');
          addModal.classList.add('flex');
        }
      }

      // Delete Item Trigger
      if (e.target.classList.contains('delete-btn')) {
        const id = e.target.getAttribute('data-id');
        if (confirm("Permanently delete this item from inventory?")) {
          remove(ref(db, `shops/${currentShopId}/inventory/${id}`));
          delete cachedInventoryData[id];
          localStorage.setItem(backupStorageKey, JSON.stringify(cachedInventoryData));
          renderCards(cachedInventoryData);
        }
      }
    });

    document.addEventListener('change', (e) => {
      if (e.target.classList.contains('qty-input')) {
        updateQuantity(e.target.getAttribute('data-id'), e.target.value);
      }
    });

    document.getElementById('category-filter').addEventListener('change', () => renderCards(cachedInventoryData));

    // Save / Update Material Action
    document.getElementById('save-material-btn').addEventListener('click', () => {
      const editId = document.getElementById('edit-item-id').value;
      const category = document.getElementById('mat-category').value;
      const name = document.getElementById('mat-name').value.trim();
      const dimensions = document.getElementById('mat-dimensions').value.trim();
      const pricingMode = document.getElementById('pricing-mode').value;
      const price = document.getElementById('mat-price').value.trim();
      const quantity = document.getElementById('mat-quantity').value.trim();
      const reserved = document.getElementById('mat-reserved').value.trim();

      if (!name) {
        alert('Please enter a material name.');
        return;
      }

      const itemData = {
        category,
        name,
        dimensions: dimensions || 'Standard',
        pricingMode,
        price: price || '0.00',
        quantity: quantity || '1',
        reserved: reserved || 'General Stock'
      };

      if (editId) {
        // Update existing item
        cachedInventoryData[editId] = itemData;
        localStorage.setItem(backupStorageKey, JSON.stringify(cachedInventoryData));
        renderCards(cachedInventoryData);
        update(ref(db, `shops/${currentShopId}/inventory/${editId}`), itemData).catch(() => {});
      } else {
        // Create new item
        const newRef = push(inventoryRef);
        const newItemId = newRef.key;
        cachedInventoryData[newItemId] = itemData;
        localStorage.setItem(backupStorageKey, JSON.stringify(cachedInventoryData));
        renderCards(cachedInventoryData);
        set(newRef, itemData).catch(() => {});
      }

      addModal.classList.add('hidden');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
